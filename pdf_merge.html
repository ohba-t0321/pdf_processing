<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="css/main.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

  <title>PDF Manipulation</title>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
  <h1>PDFを結合させるツール</h1>
  <!-- objectを左右に並べる -->
  <div class="object">
    <div id="dropZone">ここにファイルをドロップ</div>
    <div id="fileList">ファイル一覧:
      <div class="file-container" id="fileContainer">
        <!-- ファイル名を表示するためのdivをここに追加します -->
      </div>
      <p>ファイルのタイルをドラッグすると順序を入れ替えられます。</p>
      <p>ファイル右上の×ボタンで該当ファイルを削除できます。</p>
      <!-- 全ファイルを削除する場合 -->
      <button id="clearAllBtn" class="btn btn-danger" onclick="clearAllFiles()">全て削除</button>
    </div>
    <button type="submit" class="btn btn-primary" id="mergePdfBtn" onclick="mergePDFBtnClick()">結合</button>
  </div>
  <div class="object">
    <button type="submit" class="btn btn-primary" id="downloadPdfBtn" onclick="download(mergedPdfBytes,'merged.pdf')" disabled>ダウンロード</button>
    <iframe id="pdfViewer" title="結合結果"></iframe>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
  <script src="script/main.js"></script>
</body>
</html>
