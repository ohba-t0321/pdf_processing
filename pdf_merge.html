<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Manipulation</title>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    #fileList {
      margin-top: 10px;
      margin-bottom: 20px;
    }
    #pdfViewer {
      margin-top: 20px;
      width: 100%;
      height: 500px;
      border: 1px solid #ccc;
    }
    #dropZone {
      width: 50%;
      height: 100px;
      border: 2px dashed #ccc;
      text-align: center;
      line-height: 100px;
      color: #aaa;
      margin-bottom: 20px;
    }
    #dropZone.dragover {
      border-color: #000;
      color: #000;
    }
    .object{
        display: block;
    }
  </style>
</head>
<body>
  <h1>PDFを結合させるツール</h1>
  <div class="object">
    <p id="dropZone">ここにファイルをドロップ</p>
    <p id="fileList"></p>
    <br>
    <button id="mergePdfBtn">結合</button>
  </div>
  <div class="object">
    <iframe id="pdfViewer"></iframe>
  </div>
  <script>
    const dropZone = document.getElementById('dropZone');
    const fileListDiv = document.getElementById('fileList');
    let fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.multiple = true;

    fileInput.addEventListener('change', handleFiles);

    dropZone.addEventListener('dragover', (event) => {
      event.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (event) => {
      event.preventDefault();
      dropZone.classList.remove('dragover');
      handleFiles(event);
    });

    function handleFiles(event) {
      const files = event.dataTransfer ? event.dataTransfer.files : event.target.files;
      if (files.length > 0) {
        displayFileList(files);
        if (files[0].type === 'application/pdf') {
          // displayPDF(files[0]);
        }
      }
    }

    function displayFileList(files) {
      fileListDiv.innerHTML = '<ul>' + Array.from(files).map(file => `<li>${file.name}</li>`).join('') + '</ul>';
      fileInput.files = files; // Update the hidden file input with selected files
    }

    async function displayPDF(file) {
      const arrayBuffer = await file.arrayBuffer();
      currentPdfBytes = arrayBuffer;
      const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
      const pdfBytes = await pdfDoc.save();
      showPDF(pdfBytes);
    }

    document.getElementById('mergePdfBtn').addEventListener('click', async () => {
      const files = fileInput.files;
      if (files.length < 2) {
        alert('Please select at least two PDF files.');
        return;
      }

      const arrayBuffers = [];
      for (const file of files) {
        const arrayBuffer = await file.arrayBuffer();
        arrayBuffers.push(arrayBuffer);
      }

      const mergedPdfBytes = await mergePDFs(arrayBuffers);
      showPDF(mergedPdfBytes);
    //   download(mergedPdfBytes, 'merged.pdf');
    });

    async function mergePDFs(pdfArrayBuffers) {
      const mergedPdf = await PDFLib.PDFDocument.create();
      
      for (const pdfArrayBuffer of pdfArrayBuffers) {
        const pdf = await PDFLib.PDFDocument.load(pdfArrayBuffer);
        const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
        copiedPages.forEach(page => {
          mergedPdf.addPage(page);
        });
      }

      const pdfBytes = await mergedPdf.save();
      return pdfBytes;
    }

    function showPDF(data) {
      const blob = new Blob([data], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);

      const pdfViewer = document.getElementById('pdfViewer');
      pdfViewer.src = url;
    }

    function download(data, filename) {
      const blob = new Blob([data], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
